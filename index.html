<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Fotográfica | Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar fixed-top glass-nav">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 elegant-brand">Tu Estudio Fotográfico</span>
        </div>
    </nav>

    <header class="text-center autumn-header">
        <h1 class="elegant-title text-white">Julissa Gonzalez</h1>
        <p class="elegant-subtitle text-white-50">Sesión de Otoño | 2026</p>
    </header>

<main class="container gallery-container mb-5">
        
        <div id="featureContainer" class="mb-5"></div>

        <div class="row g-4" id="gridContainer"></div>

    </main>

<div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
    
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center position-relative">
                    
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 z-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    
                    <img src="" id="modalImage" class="img-fluid rounded shadow-lg" alt="Vista previa">

                    <button id="prevBtn" class="slider-btn prev-btn">&#10094;</button>
                    <button id="nextBtn" class="slider-btn next-btn">&#10095;</button>
                    <div class="d-block mt-4">
                        <a id="downloadBtn" href="" download="fotografia.jpg" class="download-btn">
                            <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                            </svg>
                            Descargar Alta Resolución
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
