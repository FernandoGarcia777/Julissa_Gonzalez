<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Fotográfica | Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar fixed-top glass-nav">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 elegant-brand">Tu Estudio Fotográfico</span>
        </div>
    </nav>

    <header class="text-center autumn-header">
        <h1 class="elegant-title text-white">Julissa Gonzalez</h1>
        <p class="elegant-subtitle text-white-50">Sesión de Otoño | 2026</p>
    </header>

    <main class="container gallery-container mb-5">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4 reveal">
                <div class="img-wrapper shadow-sm">
                    <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Foto 1" class="img-fluid gallery-img">
                    <div class="glass-overlay" data-bs-toggle="modal" data-bs-target="#photoModal">
                        <span>Ampliar Fotografía</span>
                    </div>
                </div>
            </div>
            
            <div class="col-12 col-md-6 col-lg-4 reveal">
                <div class="img-wrapper shadow-sm">
                    <img src="https://images.unsplash.com/photo-1516222338250-863216ce01ea?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Foto 2" class="img-fluid gallery-img">
                    <div class="glass-overlay" data-bs-toggle="modal" data-bs-target="#photoModal">
                        <span>Ampliar Fotografía</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 reveal">
                <div class="img-wrapper shadow-sm">
                    <img src="https://images.unsplash.com/photo-1478146896981-b80fe463b330?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Foto 3" class="img-fluid gallery-img">
                    <div class="glass-overlay" data-bs-toggle="modal" data-bs-target="#photoModal">
                        <span>Ampliar Fotografía</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    <img src="" id="modalImage" class="img-fluid rounded shadow-lg" alt="Vista previa">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
